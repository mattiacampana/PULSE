# R&S NGMO2 autonomous power-capture overlay. Load after pulse_benchmark.conf.
# Flash both boards first, then remove both debug boards and both FPC cables.

CONFIG_SENSWEAR_PULSE_GPIO_MARKERS=n
CONFIG_SENSWEAR_PULSE_UART_PACED_CAPTURE=n
CONFIG_SENSWEAR_PULSE_NGMO2_AUTONOMOUS_CAPTURE=y
CONFIG_SENSWEAR_PULSE_NGMO2_EVENT_DEADLINE_MS=45000
CONFIG_SENSWEAR_PULSE_NGMO2_PERSIST_DEADLINE_MS=135000
CONFIG_SENSWEAR_PULSE_WARMUP_REPETITIONS=5
CONFIG_SENSWEAR_PULSE_REPETITIONS=100
CONFIG_SENSWEAR_PULSE_EXCHANGE_TIMEOUT_MS=20000

# The power image has no console activity. Stored proofs are recovered later
# with pulse_ngmo2_export.conf, outside the measured circuit and time window.
CONFIG_PRINTK=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_SETTINGS=n
CONFIG_SETTINGS_NVS=n
