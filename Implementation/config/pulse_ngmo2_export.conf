# Stored-proof recovery overlay. Attach a debug board only after the analyzer
# outputs are off and the power experiment is complete, then flash this image.

CONFIG_SENSWEAR_PULSE_GPIO_MARKERS=n
CONFIG_SENSWEAR_PULSE_UART_PACED_CAPTURE=n
CONFIG_SENSWEAR_PULSE_NGMO2_AUTONOMOUS_CAPTURE=y
CONFIG_SENSWEAR_PULSE_NGMO2_EXPORT_ONLY=y
CONFIG_SENSWEAR_PULSE_WARMUP_REPETITIONS=5
CONFIG_SENSWEAR_PULSE_REPETITIONS=100
CONFIG_SENSWEAR_PULSE_EXCHANGE_TIMEOUT_MS=20000

CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_SETTINGS=n
CONFIG_SETTINGS_NVS=n
