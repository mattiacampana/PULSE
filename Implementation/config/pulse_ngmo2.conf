# R&S NGMO2 markerless measurement overlay. Load after pulse_benchmark.conf.
# Both boards are sampled by the NGMO2 under one *TRG; the initiator UART paces
# exactly one quiet capture envelope and both boards defer records until DUMP.
CONFIG_SENSWEAR_PULSE_GPIO_MARKERS=n
CONFIG_SENSWEAR_PULSE_UART_PACED_CAPTURE=y
CONFIG_SENSWEAR_PULSE_CAPTURE_QUIET_GUARD_MS=250
