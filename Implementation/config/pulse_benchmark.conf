# Section V PULSE release benchmark overlay. Loaded after prj.conf.

# Measured release: no log records, shell, boot banner, or LEDs. printk remains
# solely for result export after the internally timed event has ended.
CONFIG_LOG=n
CONFIG_DEBUG=n
CONFIG_SHELL=n
CONFIG_I2C_SHELL=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_ASSERT=n
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_SPI=y
CONFIG_PINCTRL=y

CONFIG_SENSWEAR_PULSE_BENCHMARK=y
CONFIG_SENSWEAR_PULSE_GPIO_MARKERS=y
CONFIG_SENSWEAR_DAUGHTER_NONE=y
CONFIG_SENSWEAR_DEVICE_MANAGER=y
CONFIG_SENSWEAR_BHI360_DRIVER=y
CONFIG_SENSWEAR_DAUGHTER_IF_DRIVER=y

# Optional hardware not used by the replayed HAR feasibility workload.
CONFIG_SENSWEAR_BQ25180_DRIVER=n
CONFIG_SENSWEAR_BQ27427_DRIVER=n
CONFIG_SENSWEAR_LP5562_DRIVER=n
CONFIG_SENSWEAR_M95P_DRIVER=n
CONFIG_SENSWEAR_TPSM83102_DRIVER=n
CONFIG_SENSWEAR_RTC_DRIVER=y
CONFIG_SENSWEAR_RTC_AUTO_INIT=n
CONFIG_SENSWEAR_M95P_DISK=n
CONFIG_SENSWEAR_M95P_DISK_AUTOMOUNT=n
CONFIG_FILE_SYSTEM=n
CONFIG_DISK_ACCESS=n
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=n
CONFIG_NVS=n
CONFIG_FLASH_MAP=n

CONFIG_FPU=y
CONFIG_FP_HARDABI=y
CONFIG_TIMING_FUNCTIONS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_HWINFO=y

# Dual-role, unbonded benchmark transport. Identity addresses are used only to
# assign a stable role; no private observations or labels cross the link.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=n
CONFIG_BT_BONDABLE=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_DEVICE_NAME="SensWear PULSE"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y

# The benchmark owns fixed workspaces and does not allocate model state.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SENSWEAR_PULSE_EVENT_WORKQUEUE_STACK_SIZE=4096
CONFIG_SENSWEAR_PULSE_DISCOVERY_SETTLE_MS=500
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYS_HEAP_RUNTIME_STATS=y
