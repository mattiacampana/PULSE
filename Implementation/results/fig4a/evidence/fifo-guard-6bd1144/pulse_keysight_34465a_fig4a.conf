# Reduced two-board campaign for Figure 4a using one Keysight 34465A.
#
# Both boards run this same image and retain automatic identity-based role
# election. The Keysight triggers on the measured supply-current rise, so no
# GPIO marker access is required. A 60 s boot delay gives the operator time to
# arm the DMM after both boards reach their idle current. A 5 s minimum
# start-to-start period leaves about 0.9 s after each 205 x 20 ms post-trigger
# window for the host to fetch the record and rearm the DMM. The 34465A requires
# one trigger per arm whenever pretrigger sampling is enabled.
CONFIG_SENSWEAR_PULSE_GPIO_MARKERS=n
CONFIG_SENSWEAR_PULSE_KEYSIGHT_FIG4A_CAPTURE=y
CONFIG_SENSWEAR_PULSE_START_DELAY_MS=60000
CONFIG_SENSWEAR_PULSE_EVENT_GAP_MS=1500
CONFIG_SENSWEAR_PULSE_MIN_EVENT_PERIOD_MS=5000
