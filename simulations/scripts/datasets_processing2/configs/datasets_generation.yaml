# Global paths and deterministic subject-level allocation.
raw_dir: /home/mattia/DeepRAP/opportunistic_simulator/data/raw
output_dir: /home/mattia/DeepRAP/opportunistic_simulator/data/processed
seed: 42

# Keep existing raw archives. Audio-IMU Cough must be downloaded manually.
force_download: false

# Set this to true for the first run so that existing full-dataset outputs are
# rebuilt with subject-disjoint pretraining, validation, and simulation splits.
# Set it back to false after all datasets have been regenerated successfully.
force_preprocess: true

datasets:
  # 30 subjects: 26 pretraining, 4 validation, 0 simulation.
  uci_har:
    pretrain_users: 26
    validation_users: 4
    simulation_users: 0

  # HHAR has only 9 subjects, so it cannot provide 10 simulation users.
  # It is only used for simulations, adapting the encoder trained
  # with UCI-HAR
  hhar: {}

  # 15 subjects: preserving 10 simulation users leaves a deliberately small
  # but subject-disjoint pretraining/evaluation partition.
  wesad:
    window_seconds: 60
    stride_seconds: 30
    pretrain_users: 3
    validation_users: 2
    simulation_users: 10

  # 38 subjects: 22 pretraining, 6 validation, 10 simulation.
  sisfall:
    window_seconds: 2.56
    stride_seconds: 1.28
    pretrain_users: 22
    validation_users: 6
    simulation_users: 10

  # 21 subjects: 8 pretraining, 3 validation, 10 simulation.
  ringauth:
    window_seconds: 3
    target_rate_hz: 100
    source_rate_hz: 100
    pretrain_users: 8
    validation_users: 3
    simulation_users: 10

  # 469 subjects: keep a large simulation population for opportunistic runs.
  pads:
    window_seconds: 2.56
    stride_seconds: 2.56
    pretrain_users: 300
    validation_users: 50
    simulation_users: remaining

  # 13 subjects: the ten-user simulation requirement leaves only two subjects
  # for pretraining and one for validation. Treat its evaluation metrics with
  # caution because the validation population is necessarily very small.
  audio_imu_cough:
    window_seconds: 2
    imu_source_rate_hz: 100
    pretrain_users: 2
    validation_users: 1
    simulation_users: 10

  # 22 subjects: 9 pretraining, 3 validation, 10 simulation.
  pulse_transit_time:
    window_seconds: 10
    source_rate_hz: 1000
    pretrain_users: 9
    validation_users: 3
    simulation_users: 10